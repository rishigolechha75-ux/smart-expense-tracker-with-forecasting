name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: expense
          POSTGRES_PASSWORD: expense
          POSTGRES_DB: expense_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expense"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://expense:expense@localhost:5432/expense_tracker_test
      JWT_SECRET: ci-secret-key-that-is-at-least-32-bytes-long
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t expense-tracker-api backend
      - run: docker build -t expense-tracker .
      - name: Smoke test the full-app container in demo mode
        run: |
          docker run -d -p 8000:8000 -e DEMO_MODE=1 -e JWT_SECRET=ci-secret-key-that-is-at-least-32-bytes --name app expense-tracker
          for i in $(seq 30); do curl -sf localhost:8000/api/health && break; sleep 2; done
          curl -sf localhost:8000/expenses | grep -q "<div id=\"root\">"
          curl -sf localhost:8000/api/demo | grep -q '"enabled":true'
          TOKEN=$(curl -sf -X POST localhost:8000/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"demo@example.com","password":"demo-password"}' | python3 -c 'import json,sys;print(json.load(sys.stdin)["access_token"])')
          curl -sf localhost:8000/api/forecast -H "Authorization: Bearer $TOKEN" | grep -q Gradient
